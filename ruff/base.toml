# Configuração Ruff compartilhada entre todos os projetos Python
# Localização: /home/haseu/projects/lint-configs/ruff/base.toml

target-version = "py312"
line-length = 100

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming (naming conventions)
    "UP",    # pyupgrade (modernize Python code)
    "S",     # bandit (security issues)
    "B",     # flake8-bugbear (common bugs)
    "A",     # flake8-builtins (shadowing builtins)
    "C4",    # flake8-comprehensions
    "C90",   # mccabe complexity
    "RET",   # flake8-return (return statements)
    "SIM",   # flake8-simplify
    "ARG",   # flake8-unused-arguments
    "PLR",   # pylint refactoring rules
    # Adicionadas do comichub
    "ASYNC", # async/await best practices
    "DTZ",   # datetime timezone awareness
    "PIE",   # misc lints (flake8-pie)
    "T20",   # print statement detection
    "ERA",   # commented-out code (eradicate)
    "TD",    # TODO comments formatting
    "FIX",   # FIXME comments
    "PTH",   # pathlib usage (prefer Path over os.path)
    "FA",    # future annotations
    "TCH",   # type-checking blocks
    "PERF",  # performance anti-patterns (perflint)
    "FURB",  # refurb (modernize idioms)
]

ignore = [
    "F401",   # unused imports (handled by auto-ruff.py hook)
    "S101",   # assert detected (allow asserts in tests)
    "S104",   # possible binding to all interfaces (allow 0.0.0.0 in dev)
    "S311",   # pseudo-random generators (allow random module)
]

# Ignores específicos por arquivo (do comichub)
[lint.per-file-ignores]
"**/tests/**/*.py" = [
    "S101",    # asserts in tests
    "PLR2004", # magic values ok in tests
    "ARG001",  # unused function arguments (fixtures)
]
"**/migrations/**/*.py" = [
    "E501",    # line too long (generated code)
    "N999",    # invalid module name
]

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
# known-first-party deve ser configurado por projeto
