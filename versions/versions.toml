# Versões da Welt Studio: a única declaração das ferramentas governadas, igual em todos os projetos.
#
# O hook `versions` (este repo, `.pre-commit-hooks.yaml`) compara o projeto com esta tabela e
# reprova o que divergir. Política: a versão mais nova com pelo menos 7 dias de publicada. Subir uma
# ferramenta é mudar aqui, publicar uma tag `versions-vX.Y.Z` e trocar o `rev` nos projetos.
# Ruff e ESLint não estão aqui: a versão deles mora no `ruff/base.toml` e no `eslint/package.json`.

# Corte desta tabela: versões publicadas até 2026-10-15.

[runtimes]
python = "3.14.8"
node = "26.12.0"
pnpm = "12.14.0"
uv = "0.13.1"

# Ferramentas de frontend: no `catalog` do `pnpm-workspace.yaml`, versão exata, e `catalog:` em todo
# `package.json` do workspace.
[npm]
typescript = "6.0.3"
eslint = "10.12.0"
prettier = "3.9.10"
vite = "8.3.4"
vitest = "5.0.5"
"@vitejs/plugin-react" = "6.1.2"
knip = "6.41.0"
jscpd = "5.4.1"
"@types/node" = "26.6.5"

# Ferramentas de Python: pin exato (`nome==versão`) no `pyproject.toml` do pacote.
[python]
pytest = "9.1.1"
pytest-asyncio = "1.4.0"
pytest-cov = "7.1.0"
pyright = "1.1.414"

[pre-commit]
# Versão do pre-commit que a CI roda (`uvx pre-commit@<versão>`).
version = "4.7.0"
# Repositórios remotos de hooks permitidos e o `rev` de cada um. Repositório fora desta lista
# reprova: hook remoto novo entra aqui, para todos. O próprio `lint-configs` é conferido à parte
# (cada pacote dele tem a sua tag).
[pre-commit.repos]
"https://github.com/pre-commit/pre-commit-hooks" = "v6.0.0"
"https://github.com/compilerla/conventional-pre-commit" = "v4.4.0"
"https://github.com/gitleaks/gitleaks" = "v8.30.1"

# Actions do GitHub permitidas, fixadas por SHA (uma tag pode ser movida, um SHA não). Action fora
# desta lista reprova. `pnpm/setup` substitui `actions/setup-node` e `pnpm/action-setup`: ele lê o
# Node do `devEngines.runtime` e o pnpm do `packageManager`, a única declaração dos dois. O Python
# vem do uv (`.python-version`), sem `actions/setup-python`.
[actions]
"actions/checkout" = { version = "v7.0.1", sha = "3d3c42e5aac5ba805825da76410c181273ba90b1" }
"actions/upload-artifact" = { version = "v7.0.2", sha = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" }
"actions/download-artifact" = { version = "v8.0.2", sha = "9000827ccba6bdab643e8b6fd33ac0654aef8333" }
"pnpm/setup" = { version = "v3.1.1", sha = "a0881977cd8ea73b1ed212236c99ca10dcc80cf4" }
"astral-sh/setup-uv" = { version = "v10.3.0", sha = "1c37ad07a6a961277cf70c0d37d6f313000f5884" }
"docker/login-action" = { version = "v4.6.0", sha = "dbcb813823bdd20940b903addbd779551569679f" }
"docker/setup-buildx-action" = { version = "v4.4.1", sha = "f87e5991a6d7451dcb8d9637bfbc97413f497069" }
"docker/build-push-action" = { version = "v7.4.0", sha = "c3c9e263c25d99ce0380d002d59b67737d91b0dc" }
"docker/metadata-action" = { version = "v6.2.0", sha = "dc802804100637a589fabce1cb79ff13a1411302" }
"appleboy/ssh-action" = { version = "v1.2.5", sha = "0ff4204d59e8e51228ff73bce53f80d53301dee2" }
"appleboy/scp-action" = { version = "v1.0.0", sha = "ff85246acaad7bdce478db94a363cd2bf7c90345" }
"Swatinem/rust-cache" = { version = "v2.9.2", sha = "6323deb102c322ba6fcbdcafc7e3dddab59af2b6" }
"rustsec/audit-check" = { version = "v2.0.0", sha = "69366f33c96575abad1ee0dba8212993eecbe998" }

[supply-chain]
# Idade mínima de uma versão para entrar no install: `minimumReleaseAge` do pnpm (em minutos) e
# `cooldown.default-days` de todo ecossistema do Dependabot. O modo estrito do pnpm fica ligado.
minimum-release-age-days = 7
